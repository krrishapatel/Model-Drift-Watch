services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: drift
      POSTGRES_PASSWORD: drift
      POSTGRES_DB: driftradar
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://drift:drift@db:5432/driftradar
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://drift:drift@db:5432/driftradar
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

volumes:
  db_data:
