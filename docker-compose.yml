services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: drift
      POSTGRES_PASSWORD: drift
      POSTGRES_DB: driftradar
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # depends_on alone only waits for the container to start, not for postgres to
    # accept connections. The api creates its tables on startup, so on a cold
    # `docker compose up` it lost the race and exited.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drift -d driftradar"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://drift:drift@db:5432/driftradar
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://drift:drift@db:5432/driftradar
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  db_data:
