[project]
name = "drift-radar"
version = "0.1.0"
description = "Monitor ML models for data drift and performance degradation in production."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Krrisha Patel", email = "krrishapatel26@gmail.com" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite imports `app`, which lives at the repo root. Without this, pytest
# puts tests/ on the path and not the root, so every import fails at collection.
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
